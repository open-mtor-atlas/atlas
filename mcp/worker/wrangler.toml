# Cloudflare Worker: remote MCP server for Oliver's mTOR Atlas.
# Deploy:  cd mcp/worker && npm install && npx wrangler login && npx wrangler deploy
name = "mtor-atlas-mcp"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
# Off: the server keeps no request logs (see the privacy note on mtor-atlas.org/privacy/).
# Cloudflare dashboard still shows aggregate request counts and errors.
enabled = false

# Anonymous usage counts: method, tool name, client kind, outcome, duration.
# No IPs, no raw User-Agent. Tool arguments are stored (blob6, max 200 chars) since 10 Oct 2026 and never shown by /stats. Query with ../usage.mjs.
# blob7 (since 4 Nov 2026): salted SHA-256 prefix of the host's anonymous user id (ChatGPT/Codex "openai/subject"), to count
# distinct users; empty without the secret USAGE_SALT. blob8: names (not values) of the _meta keys the host sends.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "mtor_atlas_mcp_usage"

[vars]
CF_ACCOUNT_ID = "28737ccd742e4db6af4ea76764219a6f"   # for /stats (Analytics Engine SQL API)
# Secrets, not in this file: npx wrangler secret put ANALYTICS_TOKEN  (Account Analytics: Read)
#                            npx wrangler secret put USAGE_SALT       (any long random string; keep it, changing it resets user counts)
# ATLAS_API_BASE = "https://mtor-atlas.org/api/v1"   # default, override only for testing
