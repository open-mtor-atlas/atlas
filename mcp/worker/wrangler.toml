# Cloudflare Worker: remote MCP server for Oliver's mTOR Atlas.
# Deploy:  cd mcp/worker && npm install && npx wrangler login && npx wrangler deploy
name = "mtor-atlas-mcp"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
# Off: the server keeps no request logs (see the privacy note on mtor-atlas.org/privacy/).
# Cloudflare dashboard still shows aggregate request counts and errors.
enabled = false

# Anonymous usage counts: method, tool name, client kind, outcome, duration.
# No IPs, no raw User-Agent, no tool arguments. Query with ../usage.mjs.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "mtor_atlas_mcp_usage"

# [vars]
# ATLAS_API_BASE = "https://mtor-atlas.org/api/v1"   # default, override only for testing
